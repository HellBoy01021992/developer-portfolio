name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Debug Vite configuration
        run: |
          echo "Working directory:"
          pwd

          echo ""
          echo "Vite config files:"
          ls -la vite.config.*

          echo ""
          echo "vite.config.js:"
          cat vite.config.js

          echo ""
          echo "vite.config.ts:"
          cat vite.config.ts 2>/dev/null || true

          echo ""
          echo "Environment:"
          echo "GITHUB_PAGES=$GITHUB_PAGES"
          echo "VITE_API_URL=$VITE_API_URL"
          echo "VITE_SITE_URL=$VITE_SITE_URL"

      - name: Build frontend
        env:
          GITHUB_PAGES: true
          VITE_API_URL: https://developer-portfolio-api-pc7i.onrender.com/
          VITE_SITE_URL: https://hellboy01021992.github.io/developer-portfolio/
        run: npm run build

      - name: Verify GitHub Pages build
        run: |
          echo "Generated index.html:"
          grep -nE 'src=|href=' dist/index.html

          echo ""
          echo "Generated files:"
          find dist -maxdepth 2 -type f | sort

          echo ""
          echo "Checking GitHub Pages asset paths..."

          if ! grep -q '/developer-portfolio/assets/' dist/index.html; then
            echo "ERROR: GitHub Pages asset path was not generated correctly."
            exit 1
          fi

          echo "GitHub Pages asset path verified successfully."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4